# 插件描述文件：Paper 1.21.11、Java 21；第三方运行库由 Paper 的 Library Loader 加载。
# 修改命令、权限或 libraries 后需要重启服务端，作者与联系信息见 README.md。
name: CloudGift
version: '${project.version}'
main: cn.cloudgift.CloudGiftPlugin
api-version: '1.21'
authors: [MoutainSeaL]
description: 支持共享数据库、权限与自定义冷却的礼包插件
softdepend: [PlaceholderAPI]
libraries:
  - com.zaxxer:HikariCP:${hikaricp.version}
  - com.mysql:mysql-connector-j:${mysql-connector.version}
  - org.xerial:sqlite-jdbc:${sqlite-jdbc.version}

commands:
  gift:
    description: 领取或查看礼包
    usage: /gift <礼包ID>
    aliases: [libao, cgift]
  cloudgift:
    description: CloudGift 管理命令
    usage: /cloudgift <reload|saveitem|list|claim|reset|gui>
    aliases: [cloudgifts]

permissions:
  cloudgift.admin:
    description: 允许使用 CloudGift 的全部管理命令
    default: op
  cloudgift.command.gift:
    description: 允许使用礼包领取命令
    default: true
