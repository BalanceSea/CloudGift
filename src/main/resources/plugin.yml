# 插件描述文件：Paper 1.21.11、Java 21；第三方运行库由 Paper 的 Library Loader 加载。
# 修改命令、权限或 libraries 后需要重启服务端，作者与联系信息见 README.md。
name: CloudGift
version: '${project.version}'
main: cn.cloudgift.CloudGiftPlugin
api-version: '1.21'
authors: [MoutainSeaL]
description: 支持共享数据库、权限与自定义冷却的礼包插件
softdepend: [PlaceholderAPI]
libraries:
  - com.zaxxer:HikariCP:${hikaricp.version}
  - com.mysql:mysql-connector-j:${mysql-connector.version}
  - org.xerial:sqlite-jdbc:${sqlite-jdbc.version}

commands:
  gift:
    description: 领取或查看礼包
    usage: /gift <礼包ID>
    aliases: [libao, cgift]
  cloudgift:
    description: CloudGift 管理命令
    usage: /cloudgift <help|reload|menu|add|remove|claim|list>
    aliases: [cloudgifts]

permissions:
  cloudgift.admin:
    description: 允许使用 CloudGift 的全部管理命令
    default: op
    children:
      cloudgift.command.reload: true
      cloudgift.command.menu: true
      cloudgift.command.add: true
      cloudgift.command.remove: true
      cloudgift.command.list: true
  cloudgift.command.gift:
    description: 允许使用礼包领取命令
    default: true
  cloudgift.command.reload:
    description: 允许重载 CloudGift 配置
    default: op
  cloudgift.command.menu:
    description: 允许打开礼包编辑菜单
    default: op
  cloudgift.command.add:
    description: 允许保存主手物品
    default: op
  cloudgift.command.remove:
    description: 允许移除玩家礼包领取记录
    default: op
  cloudgift.command.list:
    description: 允许查看已载入的礼包
    default: op
